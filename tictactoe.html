<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tic-Tac-Toe</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			text-align: center;
			margin: 2rem auto;
			padding: 0 1rem;
			max-width: 420px;
		}

		.board {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
			margin: 1.5rem auto;
		}

		.cell {
			aspect-ratio: 1;
			font-size: 3rem;
			font-weight: bold;
			cursor: pointer;
		}

		#status {
			min-height: 1.5em;
		}
	</style>
</head>
<body>
	<h1>Tic-Tac-Toe</h1>
	<p id="status" aria-live="polite">Player X's turn</p>
	<div class="board" id="board" aria-label="Tic-Tac-Toe board"></div>
	<button id="reset" type="button">New game</button>
	<p><a href="animated.html">Back to the animated GIF page</a></p>

	<script>
		const board = document.querySelector("#board");
		const status = document.querySelector("#status");
		const cells = [];
		const winningLines = [
			[0, 1, 2], [3, 4, 5], [6, 7, 8],
			[0, 3, 6], [1, 4, 7], [2, 5, 8],
			[0, 4, 8], [2, 4, 6]
		];
		let currentPlayer;
		let gameOver;

		function startGame() {
			currentPlayer = "X";
			gameOver = false;
			status.textContent = "Player X's turn";
			cells.forEach(cell => {
				cell.textContent = "";
				cell.disabled = false;
			});
		}

		function checkWinner() {
			return winningLines.some(([a, b, c]) =>
				cells[a].textContent &&
				cells[a].textContent === cells[b].textContent &&
				cells[a].textContent === cells[c].textContent
			);
		}

		for (let i = 0; i < 9; i++) {
			const cell = document.createElement("button");
			cell.className = "cell";
			cell.type = "button";
			cell.setAttribute("aria-label", `Cell ${i + 1}`);
			cell.addEventListener("click", () => {
				if (gameOver || cell.textContent) return;

				cell.textContent = currentPlayer;
				cell.setAttribute("aria-label", `Cell ${i + 1}, ${currentPlayer}`);

				if (checkWinner()) {
					status.textContent = `Player ${currentPlayer} wins!`;
					gameOver = true;
				} else if (cells.every(square => square.textContent)) {
					status.textContent = "It's a draw!";
					gameOver = true;
				} else {
					currentPlayer = currentPlayer === "X" ? "O" : "X";
					status.textContent = `Player ${currentPlayer}'s turn`;
				}
			});
			cells.push(cell);
			board.appendChild(cell);
		}

		document.querySelector("#reset").addEventListener("click", startGame);
		startGame();
	</script>
</body>
</html>
